<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img" aria-label="Microcycle volume surcharge pic deload">
  <defs>
    <style>
      .t { font-family: Syne, 'DM Sans', system-ui, sans-serif; fill: #e8f4fd; }
      .m { font-family: 'DM Sans', system-ui, sans-serif; fill: #78909c; }
      .w { font-family: 'DM Sans', system-ui, sans-serif; fill: #0b1426; font-weight: 700; }
    </style>
  </defs>
  <rect width="800" height="220" rx="8" fill="#0b1426"/>

  <text class="t" x="32" y="36" font-size="18" font-weight="700">Microcycle — volume → surcharge → pic → deload</text>
  <text class="m" x="32" y="56" font-size="12">Israetel · à l’intérieur d’un meso concentré</text>

  <rect x="60" y="130" width="140" height="50" rx="8" fill="#4fd1c7"/>
  <text class="w" x="130" y="160" font-size="12" text-anchor="middle">1 - Volume</text>
  <text class="m" x="130" y="198" font-size="10" text-anchor="middle">adaptatif</text>

  <rect x="240" y="110" width="140" height="70" rx="8" fill="#64ffda"/>
  <text class="w" x="310" y="150" font-size="12" text-anchor="middle">2 - Surcharge</text>
  <text class="m" x="310" y="198" font-size="10" text-anchor="middle">charge utile</text>

  <rect x="420" y="90" width="140" height="90" rx="8" fill="#82b1ff"/>
  <text class="w" x="490" y="140" font-size="12" text-anchor="middle">3 - Pic</text>
  <text class="m" x="490" y="198" font-size="10" text-anchor="middle">densité / intensité</text>

  <rect x="600" y="145" width="140" height="35" rx="8" fill="#ffe082"/>
  <text class="w" x="670" y="167" font-size="12" text-anchor="middle">4 - Deload</text>
  <text class="m" x="670" y="198" font-size="10" text-anchor="middle">~ -30% volume</text>

  <path d="M200 155 L240 145" stroke="#37474f" stroke-width="2"/>
  <path d="M380 145 L420 135" stroke="#37474f" stroke-width="2"/>
  <path d="M560 135 L600 162" stroke="#37474f" stroke-width="2"/>
</svg>
