<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-label="Année multi-pics — Bompa">
  <defs>
    <linearGradient id="g-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#36f9f6"/>
      <stop offset="100%" stop-color="#72f1b8"/>
    </linearGradient>
    <linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7edb"/>
      <stop offset="100%" stop-color="#ff7edb"/>
    </linearGradient>
    <linearGradient id="g-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b893ce"/>
      <stop offset="100%" stop-color="#b893ce"/>
    </linearGradient>
    <style>
      .t { font-family: 'Space Grotesk', system-ui, sans-serif; fill: #ffffff; }
      .m { font-family: 'Space Grotesk', system-ui, sans-serif; fill: #848bbd; }
      .l { font-family: 'Space Grotesk', system-ui, sans-serif; fill: #d4cfe8; }
    </style>
  </defs>
  <rect width="800" height="280" rx="8" fill="#241b2f"/>

  <text class="t" x="32" y="36" font-size="18" font-weight="700">Année — 2 à 3 macrocycles</text>
  <text class="m" x="32" y="56" font-size="12">Bompa · multi-pics · pas un seul run FORCE→GYM→SPEC</text>

  <line x1="40" y1="200" x2="760" y2="200" stroke="#495495" stroke-width="2"/>

  <rect x="40" y="100" width="200" height="72" rx="8" fill="#34294f" stroke="url(#g-green)" stroke-width="1.5"/>
  <text class="t" x="140" y="130" font-size="13" font-weight="700" text-anchor="middle">Macro A</text>
  <text class="l" x="140" y="150" font-size="11" text-anchor="middle">besoin prioritaire #1</text>
  <text class="m" x="140" y="166" font-size="10" text-anchor="middle">~12-16 sem.</text>
  <circle cx="240" cy="200" r="6" fill="#36f9f6"/>
  <text class="m" x="240" y="222" font-size="10" text-anchor="middle">pic</text>

  <rect x="260" y="88" width="200" height="72" rx="8" fill="#34294f" stroke="url(#g-blue)" stroke-width="1.5"/>
  <text class="t" x="360" y="118" font-size="13" font-weight="700" text-anchor="middle">Macro B</text>
  <text class="l" x="360" y="138" font-size="11" text-anchor="middle">besoin prioritaire #2</text>
  <text class="m" x="360" y="154" font-size="10" text-anchor="middle">~12-16 sem.</text>
  <circle cx="460" cy="200" r="6" fill="#ff7edb"/>
  <text class="m" x="460" y="222" font-size="10" text-anchor="middle">pic</text>

  <rect x="480" y="76" width="180" height="72" rx="8" fill="#34294f" stroke="url(#g-purple)" stroke-width="1.5"/>
  <text class="t" x="570" y="106" font-size="13" font-weight="700" text-anchor="middle">Macro C</text>
  <text class="l" x="570" y="126" font-size="11" text-anchor="middle">spécifique / pic majeur</text>
  <text class="m" x="570" y="142" font-size="10" text-anchor="middle">~12-16 sem.</text>
  <circle cx="660" cy="200" r="7" fill="#b893ce"/>
  <text class="m" x="660" y="222" font-size="10" text-anchor="middle">A-pic</text>

  <rect x="680" y="120" width="80" height="52" rx="8" fill="#34294f" stroke="#495495" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="l" x="720" y="142" font-size="11" font-weight="600" text-anchor="middle">TRANS</text>
  <text class="m" x="720" y="158" font-size="9" text-anchor="middle">2-4 sem.</text>

  <text class="m" x="40" y="256" font-size="11">Chaque macro = stages Issurin (Acc → Trans → Réalisation). Les pics s’ancrent sur les comps.</text>
</svg>
