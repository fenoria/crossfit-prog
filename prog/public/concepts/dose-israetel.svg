<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="Dose Israetel MEV MAV MRV">
  <defs>
    <linearGradient id="zone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#36f9f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#36f9f6" stop-opacity="0.02"/>
    </linearGradient>
    <style>
      .t { font-family: 'Space Grotesk', system-ui, sans-serif; fill: #ffffff; }
      .m { font-family: 'Space Grotesk', system-ui, sans-serif; fill: #848bbd; }
      .l { font-family: 'Space Grotesk', system-ui, sans-serif; fill: #d4cfe8; }
    </style>
  </defs>
  <rect width="800" height="300" rx="8" fill="#241b2f"/>

  <text class="t" x="32" y="36" font-size="18" font-weight="700">Dose — MEV · MAV · MRV</text>
  <text class="m" x="32" y="56" font-size="12">Israetel · progresser entre utile et trop · deload avant de casser</text>

  <line x1="80" y1="240" x2="720" y2="240" stroke="#495495" stroke-width="1.5"/>
  <line x1="80" y1="80" x2="80" y2="240" stroke="#495495" stroke-width="1.5"/>
  <text class="m" x="40" y="160" font-size="10" transform="rotate(-90 40 160)">volume</text>
  <text class="m" x="400" y="268" font-size="11" text-anchor="middle">temps (meso)</text>

  <path d="M120 200 C 220 195, 280 150, 360 130 S 520 100, 580 90 L 580 240 L 120 240 Z" fill="url(#zone)"/>

  <path d="M100 210 C 200 205, 260 155, 360 130 S 500 95, 620 85 L 700 70"
        fill="none" stroke="#36f9f6" stroke-width="2.5" stroke-linecap="round"/>

  <line x1="80" y1="200" x2="700" y2="200" stroke="#ff7edb" stroke-width="1" stroke-dasharray="5 4"/>
  <text class="l" x="708" y="204" font-size="11" fill="#ff7edb">MEV</text>
  <text class="m" x="708" y="216" font-size="9">min utile</text>

  <circle cx="420" cy="118" r="5" fill="#36f9f6"/>
  <text class="l" x="420" y="108" font-size="11" text-anchor="middle" fill="#36f9f6">MAV</text>
  <text class="m" x="420" y="148" font-size="9" text-anchor="middle">zone cible</text>

  <line x1="80" y1="95" x2="700" y2="95" stroke="#ff8b39" stroke-width="1" stroke-dasharray="5 4"/>
  <text class="l" x="708" y="99" font-size="11" fill="#ff8b39">MRV</text>
  <text class="m" x="708" y="111" font-size="9">plafond</text>

  <path d="M640 88 L700 130" fill="none" stroke="#fede5d" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text class="l" x="710" y="148" font-size="11" fill="#fede5d">deload</text>
  <text class="m" x="710" y="162" font-size="9">- volume</text>

  <text class="m" x="80" y="290" font-size="11">Règle d’or : si fatigue ↑ → couper le volume, pas l’intention du bloc.</text>
</svg>
