<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-label="Macro 1 reconstruction">
  <defs>
    <style>
      .t { font-family: Syne, 'DM Sans', system-ui, sans-serif; fill: #e8f4fd; }
      .m { font-family: 'DM Sans', system-ui, sans-serif; fill: #78909c; }
      .l { font-family: 'DM Sans', system-ui, sans-serif; fill: #b0bec5; }
      .s { font-family: 'DM Sans', system-ui, sans-serif; fill: #0b1426; font-weight: 700; font-size: 11px; }
    </style>
  </defs>
  <rect width="800" height="240" rx="8" fill="#0b1426"/>

  <text class="t" x="32" y="36" font-size="18" font-weight="700">Macro 1 — reconstruction (dès août 2026)</text>
  <text class="m" x="32" y="56" font-size="12">Exception post-blessure : Accumulation gym avant AA force pure</text>

  <g transform="translate(28, 90)">
    <rect width="100" height="56" rx="8" fill="#1a2332" stroke="#ffe082" stroke-width="1.5"/>
    <text class="l" x="50" y="24" font-size="11" text-anchor="middle" fill="#ffe082">Benchmarks</text>
    <text class="m" x="50" y="42" font-size="9" text-anchor="middle">calibrage</text>
  </g>
  <polygon points="138,118 150,124 138,130" fill="#546e7a"/>

  <g transform="translate(158, 90)">
    <rect width="100" height="56" rx="8" fill="#64ffda"/>
    <text class="s" x="50" y="24" text-anchor="middle">ACC-GYM</text>
    <text x="50" y="42" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="9" fill="#0b1426" opacity="0.75">~4 sem.</text>
  </g>
  <polygon points="268,118 280,124 268,130" fill="#546e7a"/>

  <g transform="translate(288, 90)">
    <rect width="100" height="56" rx="8" fill="#4fd1c7"/>
    <text class="s" x="50" y="24" text-anchor="middle">ACC-STR</text>
    <text x="50" y="42" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="9" fill="#0b1426" opacity="0.75">~4 sem.</text>
  </g>
  <polygon points="398,118 410,124 398,130" fill="#546e7a"/>

  <g transform="translate(418, 90)">
    <rect width="100" height="56" rx="8" fill="#82b1ff"/>
    <text class="s" x="50" y="24" text-anchor="middle">TRA-MIX</text>
    <text x="50" y="42" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="9" fill="#0b1426" opacity="0.75">~4 sem.</text>
  </g>
  <polygon points="528,118 540,124 528,130" fill="#546e7a"/>

  <g transform="translate(548, 90)">
    <rect width="100" height="56" rx="8" fill="#b388ff"/>
    <text class="s" x="50" y="24" text-anchor="middle">REAL</text>
    <text x="50" y="42" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" font-size="9" fill="#0b1426" opacity="0.75">mini 2-3 sem.</text>
  </g>
  <polygon points="658,118 670,124 658,130" fill="#546e7a"/>

  <g transform="translate(678, 90)">
    <rect width="90" height="56" rx="8" fill="#1a2332" stroke="#546e7a" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text class="l" x="45" y="24" font-size="11" text-anchor="middle">TRANS</text>
    <text class="m" x="45" y="42" font-size="9" text-anchor="middle">-&gt; Macro 2</text>
  </g>

  <text class="m" x="32" y="190" font-size="11">Pourquoi gym d’abord : qualité limitante = répétabilité gym (pas la force max).</text>
  <text class="m" x="32" y="210" font-size="11">Les blocs se répètent dans l’année — ce n’est pas un parcours unique figé.</text>
</svg>
