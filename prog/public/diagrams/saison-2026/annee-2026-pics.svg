<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-label="Saison 2026 pics Fire Contest et S7mbioz">
  <defs>
    <style>
      .t { font-family: Syne, 'DM Sans', system-ui, sans-serif; fill: #e8f4fd; }
      .m { font-family: 'DM Sans', system-ui, sans-serif; fill: #78909c; }
      .l { font-family: 'DM Sans', system-ui, sans-serif; fill: #b0bec5; }
      .s { font-family: 'DM Sans', system-ui, sans-serif; fill: #0b1426; font-weight: 700; font-size: 12px; }
    </style>
  </defs>
  <rect width="800" height="280" rx="8" fill="#0b1426"/>

  <text class="t" x="32" y="36" font-size="18" font-weight="700">Saison 2026 — calendrier des pics</text>
  <text class="m" x="32" y="56" font-size="12">A fait (juillet) · B Fire Contest · C S7mbioz</text>

  <!-- timeline bar -->
  <rect x="40" y="120" width="720" height="12" rx="6" fill="#1a2332"/>

  <!-- Macro 1 -->
  <rect x="40" y="110" width="220" height="32" rx="8" fill="#64ffda" opacity="0.9"/>
  <text class="s" x="150" y="130" text-anchor="middle">Macro 1 Build</text>

  <!-- Macro 2 -->
  <rect x="260" y="110" width="260" height="32" rx="8" fill="#82b1ff" opacity="0.9"/>
  <text class="s" x="390" y="130" text-anchor="middle">Macro 2 Élévation</text>

  <!-- Macro 3 -->
  <rect x="520" y="110" width="160" height="32" rx="8" fill="#b388ff" opacity="0.9"/>
  <text class="s" x="600" y="130" text-anchor="middle">Macro 3</text>

  <!-- Transition -->
  <rect x="680" y="110" width="80" height="32" rx="8" fill="#1a2332" stroke="#546e7a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="l" x="720" y="130" font-size="11" text-anchor="middle">TRANS</text>

  <!-- Peak markers -->
  <line x1="230" y1="100" x2="230" y2="155" stroke="#ffe082" stroke-width="2"/>
  <text fill="#ffe082" font-family="DM Sans, system-ui, sans-serif" font-size="11" font-weight="700" x="230" y="90" text-anchor="middle">B Fire ~12 sept.</text>

  <line x1="655" y1="100" x2="655" y2="155" stroke="#ffe082" stroke-width="2"/>
  <text fill="#ffe082" font-family="DM Sans, system-ui, sans-serif" font-size="11" font-weight="700" x="655" y="90" text-anchor="middle">C S7mbioz 12–13 déc.</text>

  <text class="m" x="40" y="190" font-size="12">août</text>
  <text class="m" x="230" y="190" font-size="12">sept.</text>
  <text class="m" x="390" y="190" font-size="12">oct. – nov.</text>
  <text class="m" x="600" y="190" font-size="12">nov. – déc.</text>
  <text class="m" x="720" y="190" font-size="12">fin déc.</text>

  <text class="m" x="32" y="230" font-size="11">B = pic secondaire (expression après ACC-GYM). C = pic équipe de fin d’année.</text>
  <text class="m" x="32" y="250" font-size="11">Force / oly / mixed longs après Fire ; spécificité team avant S7mbioz.</text>
</svg>
