id: thierry
name: Thierry
age: 42
height_cm: 179
weight_kg: 87
level: elite

# Ce fichier = ÉTAT COURANT (charges, volumes, crans, planning, contraintes).
# L'historique semaine par semaine vit dans journal/ (schéma : knowledge/journal-schema.yaml).
journal_dir: athletes/thierry/journal/

goal:
  type: competition_performance
  notes: "Performance compétition ; fraîcheur et spécificité > volume gratuit. Prochaine échéance : CrossFit Open 2027 — calendrier des macros et mesos : knowledge/instances/saison-2026.yaml. Butterfly PU + C2B : technique + volume bas → modéré en Macro 3 si gate épaule, volume en format en janvier 2027. Variété de mouvements (DU, sauts, objets, haltères…) exposée chaque semaine. Prudence charges adducteur ≠ convalescence."
  # Ancre annuelle pour caler les cycles (récurrent tant que non modifié)
  competitions:
    primary_a:
      name: "Battle of Normandy Throwdown"
      when: "2ème weekend de juillet"
      role: A  # grosse compete — pic / taper prioritaire
      format_typical: team_of_3
    secondary_b:
      name: "Fire Contest"
      location: Nantes
      when: "2ème weekend de septembre"
      format: team_mixed_of_2  # team mixte à 2
      role: B  # plus petite — pic secondaire / maintien forme
    open:
      name: "CrossFit Open"
      when: "fin février – début mars (3 workouts, un par semaine)"
      format: individual
      role: B  # échéance hivernale — pic court par semaine d'Open
      routine: "workout annoncé le jeudi, fait le vendredi à la box (créneau midi)"
    opportunistic:
      notes: "Petites compet possibles dans l’année ; dates non fixées — intégrer seulement quand annoncées (sans casser le plan A/B)"
  results: athletes/thierry/history.yaml  # palmarès
  # Cible courante
  competition: "CrossFit Open 2027"
  date: "2027-02-19 → 2027-03-05"
  next_primary_a: "Battle of Normandy Throwdown — 2ème weekend juillet 2027 (à confirmer)"

body:
  composition: "très musclé"
  training_history: "sportif de toujours"

schedule:
  weekday:
    days: [mon, tue, wed, thu, fri]
    time: "12:00-13:30"
    max_minutes: 90
    team_day: wed  # souvent WOD team box — compter fatigue
    notes: "Pas de séance cardio en semaine hors box. Trajet vélo occasionnel vers la box (~4 km A/R) : négligeable — ne compte ni comme Z2 ni comme charge (précisé 2026-10-03). Le Z2 se fait en bloc écrit : sortie ≥ 40–60’ samedi ou dimanche (VTT, vélo ou course easy) ou en fin de séance box. Exploiter le créneau de 90’ : une séance légère (décharge, touch) est complétée par réathlétisation / mobilité / Z2 plutôt que raccourcie (retour 2026-10-03)."
  saturday:
    frequency: odd_iso_weeks_only  # MAJ 2026-09-11 : dispo uniquement les semaines ISO impaires (contrainte durable)
    time: "10:00-12:30"
    max_minutes: 150
    notes: "Semaines impaires seulement — planifier le volume « luxe » (sortie longue, bloc seuil, format long) sur ces samedis. Semaines paires : Z2 basculé au dimanche (bloc écrit, pas optionnel). Si team extra le samedi : compter comme effort dur et garder le dimanche off."
  sunday: usually_off  # Z2 écrit le dimanche les semaines sans samedi (plancher 60 min/sem.)
  preferences:
    active_recovery_over_rest: true  # Z2 > off si créneau possible
    z2_preferred_on_available_days: true

equipment:
  setting: crossfit_box
  guided_machines: false
  notes: "Matériel box standard uniquement (barres, DB, KB, rings, rig, ergos, box, WB, rope…)"

strengths:
  - ergos
  - cardio
  - technique_globale
  - wall_balls_12kg  # charge WB de référence = 12 kg (MAJ 2026-10-02) — ne plus prescrire 9 kg
  - burpees

priorities:
  - gym_volume_repeatability
  - confidence_under_bar_controlled

weaknesses_or_limits:
  - gym_volume_under_fatigue
  - butterfly_pullup_cycling  # Fire 2026 WOD 3 : cut ½, RPE 10 — trou ; C2B même famille. Geste majeur de l’Open → Macro 3 (technique + volume bas/modéré) puis janvier (volume en format)
  - heavy_squat_snatch_caution
  - heavy_squat_clean_caution
  - residual_adductor_pain  # historique 2025 — charges prudentes ; pas un focus quotidien. Fire WOD 6 @ 95 kg (3 PC TNG + 3 FS + STOH) RPE 7, RAS.
  - shoulder_pain_rings_hspu  # S05 → S08 gêne légère ; S09 : douleur nette 4–5/10 sur RMU et HSPU strict + kipping (disparaît après l'effort), gêne 1–3 sur press / tractions / arraché ; BMU et HSW indolores. Dès S10 : RMU et HSPU hors plan, retour progressif seulement si 2 semaines sans douleur en poussée. Avis kiné si persistance.

injury:
  name: desinsertion_adducteur
  year: 2025
  status: residual_pain
  programming_rules:
    - "contexte : blessure ~1 an ; douleur résiduelle possible — charges contrôlées, pas PRs pré-blessure"
    - "pas de max out squat snatch / squat clean lourds"
    - "ne pas interroger systématiquement la douleur en feedback ; réagir seulement si l’athlète la signale"
    - "si douleur signalée → knowledge/adductor-protocol.yaml"
    - "réathlétisation progressive (pas seulement évitement) → knowledge/reathletisation.md"

prs_pre_injury_kg:
  # Tous 1RM / PR max — référence historique uniquement, jamais pour les %
  unit: 1rm
  back_squat: 160
  front_squat: 140
  clean: 130
  jerk: 115
  snatch: 80
  deadlift: 200
  weighted_pullup_1rm: 50

# Objets / portés — standards de compétition et capacité (retour athlète 2026-10-02)
odd_objects_kg:
  sandbag_competition: 70        # standard compet → charge cible des formats ; progression S12–S13 50 → S14–S15 70
  sandbag_box_available: [50, 70]  # seuls sacs dispo à la box — ne prescrire que ces deux charges
  farmer_competition_per_hand: 32
  farmer_capacity_per_hand: 40   # 2×40 supporté en surcharge
  notes: "Ne pas prescrire sous ces repères en format compétition ; adducteur : ramassage hanche haute, repli 50 kg si tension."

prs_current_kg:
  # S01 benchmarks (2026-08-03 → 09) — charges de travail RPE 8–9, pas des 1RM
  # SoT pour les % de prog ; ne pas confondre avec prs_pre_injury_kg (1RM)
  # Détail des séances de test : journal/S01-2026-08-03.yaml
  unit: working_weight  # 2–3RM ou singles RPE 7–9 selon le lift
  back_squat: 130        # 3RM @ RPE 9 ; tension adducteur dès ~120 (pas douleur)
  front_squat: 120       # 3RM @ RPE 9 (cible ≤8 dépassée — charge conservatrice pour %)
  deadlift: 180          # 2RM @ RPE 9
  strict_press: 70       # 2RM @ RPE 9
  weighted_pullup: 40    # 3RM @ RPE 9.5 ; single 52 @ RPE 10 (échec menton @ 54)
  power_snatch: 70       # 3 singles @ RPE 9 (S01) · S09 : single @ 73 kg RPE ≤ 7 — valeur sous-estimée, re-test S12
  power_clean: 100       # 3 singles @ RPE 9
  clean: null            # non testé (power only)
  jerk: null             # non testé
  snatch: null           # non testé (squat snatch interdit profil)
  notes: "SoT charges courantes post-S01. % prog sur ces valeurs uniquement — pas sur prs_pre_injury_kg."
  tested_on: "2026-08-03 to 2026-08-07"

# Ancres physiologiques conditioning — pilotent Z2 / seuil (knowledge/conditioning-matrix.yaml)
aerobic_anchors:
  status: partial       # à compléter au test du samedi 10 octobre (S10)
  updated: "2026-09-11"
  hr_max_bpm: null      # jamais mesuré ; estimation d'âge (~178) trop grossière pour prescrire
  z2_hr_ceiling_bpm: 130
  z2_hr_source: "S04 : course 14 km à 6'26/km, 119 bpm moyens, ressenti conversationnel — plafond posé au-dessus du relevé, à confirmer"
  run_z2_pace: "6'15–6'45/km"
  run_threshold_pace: null
  row_2k_split: null
  bike_10min_avg_watts: null
  tested_on: "2026-08-30 (partiel, sortie Z2 seulement)"
  note: "Tant qu'une ancre est null, la prescription reste en RPE (repli prévu par la matrice conditioning)."

# Volumes Israetel — INSTANCE athlète.
# Bornes méthodo : knowledge/volume-landmarks.yaml (référence ; le profil gagne pour la prog courante).
volumes:
  updated: "2026-09-11"
  # Calendrier des blocs : knowledge/instances/saison-2026.yaml
  # TRA-POW (révisé 2026-10-03) : plus de séries lourdes lentes — squat de vitesse ~60 % (S11), contraste BS 3×2 @ 110 → box jumps (S12), push press + traction explosive à la place de press strict / traction lestée lourds
  gym:
    unit: skill_minutes_quality_per_week
    mev: 50
    mav: 80
    mrv: 100
    current_target: 30   # maintien ACC-STR / TRA-POW (2 séances skill) → 50 en TRA-MIX (gym dans les couplets)
  force_lower:
    unit: hard_sets_per_week
    mev: 4
    mav: 8
    mrv: 12
    current_target: 8    # S10 pic ~11 (BS 5 + FS 3 + DL 3, sous MRV) · S11 décharge 0 (squat de vitesse) · S12 contraste 3 · TRA-MIX ~3 (1 stimulus/sem.)
  force_upper:
    unit: hard_sets_per_week
    mev: 4
    mav: 8
    mrv: 12
    current_target: 8    # ACC-STR S10 pic 8 (press 4×4 + WPU 4×4) · TRA-POW : push press 4–5 séries (S11–S12), traction explosive hors séries dures · TRA-MIX ~3–6
    load_anchoring: "Ré-ancré après S08–S09 (RPE 8+ deux semaines de suite au prescrit) : press ~60 kg ×3–4 et traction +30–32 ×3–4 = RPE 8+. Prescrire RPE 7–8 à press 57,5 kg ×4 et traction +28–30 ×4 ; ne plus partir de prs_current (70 / +40) pour l'upper."
  oly:
    unit: quality_lifts_per_week
    mev: 10
    mav: 20
    mrv: 30
    current_target: 10   # ACC-STR ~14 (le résidu barre ne tombe pas à 0)
    # TRA-POW : ~20–25 (dominant, sous MRV 30) · TRA-MIX : ~8–12 (maintien, charges légères dans les formats)
    load_anchoring: "Prescrire sur le ressenti réel : arraché puissance 65–72,5 kg et épaulé puissance 90–100 kg sont à RPE ≤ 7 (S04, S06) ; S09 arraché 73 et tirage arraché 100 à RPE ≤ 7 → ancre arraché puissance 70–75 kg (RPE ≤ 7), tirage arraché 95–105 kg. Ne plus prescrire en dessous (62,5 / 87,5) — l'athlète fait ses charges habituelles et le journal devient faux."
  z2:
    unit: minutes_per_week
    mev: 60
    mav: 120
    mrv: 180
    current_target: 60   # plancher — blocs écrits dans les séances (samedi impair 60–75’ ou dimanche 50’), plus de finisher « si temps »
  conditioning_hard:
    unit: hard_minutes_per_week
    current_target: 0    # ACC-STR : team mercredi seul (+ 1 bloc seuil 12–15’ RPE 6–7 dès S09)
    tra_mix_target: 30   # TRA-MIX : team + 1 format chronométré par semaine, cap 30 min cumulées

gym_ladder_level:
  # crans 1–5 — knowledge/gym-ladder.md ; baseline S01, MAJ S04 (2026-08-30)
  bmu: 4       # S04 : EMOM 14' 4 UB propres + 10 cal, ~15 s repos — cran 4 couplet validé (plafond)
  rmu: 4       # S04 : EMOM 10' 2+10 cal, ~15 s repos — cran 4 couplet validé
  hspu: 3      # S04 : 5×10 strict plafond (~0 RIR dernières) — cran 3 stable
  hsw: 4       # S04 : 5× (10 m + pivot + 10 m) unbroken — cran 4 confirmé (vs 6+6 S03)
  hspu_kipping_plan: "Geste déjà acquis (retour athlète, 29 sept. 2026) — ne pas programmer des drills de technique comme stimulus. SUSPENDU depuis S09 (douleur 4–5/10 en strict et kipping, règle de rampe : deux gênes consécutives → hors plan). Réintroduction : strict d'abord, à douleur 0–2, après 2 semaines sans douleur en poussée ; puis kipping EMOM court. Cible cran 4 au relevé S15 à réévaluer selon l'épaule."
  kipping_pull_plan: "Butterfly PU + C2B : trou Fire 2026 (WOD 3, cut ½), geste majeur de l’Open 2027. Pas dans Macro 2. Macro 3 (16 nov. – 20 déc., accumulation gym) : kip swings + kipping PU en séries de 3–5 (S16) → butterfly en séries courtes (S17) → C2B en EMOM (S18–S19) → série de référence (S20). Condition : traction indolore ou gêne ≤ 2/10 ; à 3/10 ou plus, retour aux kip swings. Volume en format (Open) en janvier 2027."
  maintien_format: "En maintien, garder le format du cran (couplet BMU + pivot en HSW) — le linéaire et les séries sèches sont une régression de spécificité."

benchmarks:
  last_run: "2026-08-07"
  next_due: "intégré à Macro 2 — pas de semaine de tests séparée"
  history: "athletes/thierry/journal/ (une entrée par semaine)"
  box_jump_max_cm: 116  # S03 (2026-08-19) : high jump box + disques, RPE 3 — max probablement sous-estimé · base des hauteurs de travail TRA-POW (~80–90 % = 95–105 cm)
  signature_tests: knowledge/signature-tests.yaml  # 3 tests figés rejoués à chaque macro
  measurement_plan: knowledge/instances/saison-2026.yaml  # points_de_mesure (pas de semaine de tests dédiée : la fraîcheur prime)
  battery:
    - back_squat
    - front_squat
    - deadlift
    - strict_press
    - weighted_pullup
    - snatch_technique_or_power
    - clean_technique_or_power
    - gym_volume_proxy  # BMU/RMU/HSW selon niveau actuel
    - ergo_short

coaching:
  feedback_loop: true
  language: fr
  pedagogy_required: true
  feedback_schema: "blocs Notes / feedback (### par jour) dans prog/_templates/semaine.md"
  journal_required: true  # tout feedback → entrée journal/ (knowledge/journal-schema.yaml) ; profil = état durable seulement
  prog_immutability: "semaine commencée/passée = contenu séances figé ; mise en forme OK ; Notes OK ; adaptations = futur only"
  # S04 sam 29 : EMOM 4 BMU + 10 cal et 2 RMU + 10 cal — ~15 s repos/min, passé (plafond)
  gym_couplet_dose: "EMOM 60s : viser ~15 s repos. Chez Thierry 10 cal easy = plafond tenu (S04). Si repos < 12 s ou casse → −cal ou E2MOM. 250 m = E2MOM."
  mrv_signals:
    - sommeil_degrade
    - chute_perf
    - rpe_chronique_eleve
    - douleur_signalee  # toute douleur (dont adducteur) — seulement si l’athlète la mentionne
  team_wod_rpe_threshold_cut_next_day: 8
  team_wod_log_movements: true  # dès S11 : noter mouvements + charges du WOD team (trace de la variété réellement couverte — knowledge/movement-coverage.yaml)
  adductor_focus: minimal  # pas de score quotidien ; protocole on-demand si feedback douleur
  accessory_rotation: "banque nouvelle par meso ; lifts/skills stables ; 1–2 accessoires RPE 6–7 ; pas le même duo 4 semaines ; pas de conjugate weekly (knowledge/session-patterns.yaml)"

