injury:
  name: desinsertion_adducteur
  year: 2025
  status: residual_pain
  programming_rules:
    - "contexte : blessure ~1 an ; douleur résiduelle possible — charges contrôlées, pas PRs pré-blessure"
    - "pas de max out squat snatch / squat clean lourds"
    - "ne pas interroger systématiquement la douleur en feedback ; réagir seulement si l’athlète la signale"
    - "si douleur signalée → knowledge/adductor-protocol.yaml"

prs_pre_injury_kg:
  # Tous 1RM / PR max — référence historique uniquement, jamais pour les %
  unit: 1rm
  back_squat: 160
  front_squat: 140
  clean: 130
  jerk: 115
  snatch: 80
  deadlift: 200
  weighted_pullup_1rm: 50

prs_current_kg:
  # S01 benchmarks (2026-08-03 → 09) — charges de travail RPE 8–9, pas des 1RM
  # SoT pour les % de prog ; ne pas confondre avec prs_pre_injury_kg (1RM)
  unit: working_weight  # 2–3RM ou singles RPE 7–9 selon le lift
  back_squat: 130        # 3RM @ RPE 9 ; tension adducteur dès ~120 (pas douleur)
  front_squat: 120       # 3RM @ RPE 9 (cible ≤8 dépassée — charge conservatrice pour %)
  deadlift: 180          # 2RM @ RPE 9
  strict_press: 70       # 2RM @ RPE 9
  weighted_pullup: 40    # 3RM @ RPE 9.5 ; single 52 @ RPE 10 (échec menton @ 54)
  power_snatch: 70       # 3 singles @ RPE 9
  power_clean: 100       # 3 singles @ RPE 9
  clean: null            # non testé (power only)
  jerk: null             # non testé
  snatch: null           # non testé (squat snatch interdit profil)
  notes: "SoT charges courantes post-S01. % prog sur ces valeurs uniquement — pas sur prs_pre_injury_kg."
  tested_on: "2026-08-03 to 2026-08-07"
  vs_pre_injury_1rm_estimate:
    # Extrapolation Epley grossière depuis les tests S01 — indicatif, pas pour programmer
    back_squat: "~143 kg"   # 130×3 → vs 160 PR
    front_squat: "~132 kg"  # 120×3 → vs 140 PR
    deadlift: "~192 kg"     # 180×2 → vs 200 PR
    strict_press: "~75 kg"  # 70×2 ; pas de PR pré-blessure noté
    weighted_pullup: "52 kg single @ RPE 10 → vs 50 PR (≈ au niveau ou au-dessus)"
    power_snatch: "70 kg (power) → vs snatch 80 PR full (comparaison partielle)"
    power_clean: "100 kg (power) → vs clean 130 PR full (comparaison partielle)"

