gate: null
synthese: >
  Lower dans la cible (BS 4×3 @ 115 et DL 3×3 @ 150 à RPE ≤ 7,5, FS pause 95 tenu).
  Barre facile au-dessus des fourchettes. Upper RPE 8+ pour la 2e semaine : sens
  « au-dessus » deux fois de suite sur press et tractions → ré-ancrage. Épaule : première
  douleur nette (4–5/10) sur anneaux et HSPU, BMU et HSW indolores. Team RPE 7. Zone 2 45' samedi (BikeErg), sous le plancher.
suite: >
  S10 : pic lower inchangé. RMU, HSPU strict et kipping sortis du plan (règle de rampe
  kipping : deux gênes consécutives + douleur ≥ 3) ; BMU et HSW conservés, bloc tolérance
  épaule ajouté. Press 4×4 @ 57,5, tractions 4×4 @ +28–30. Arraché 70–75, tirage 95–105.
  Adducteur reste au palier 1. Avis kiné recommandé si la douleur persiste.
