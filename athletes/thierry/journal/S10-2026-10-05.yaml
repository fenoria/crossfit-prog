semaine: S10
dates: "2026-10-05 → 2026-10-11"
macro: macrocycle-02-elevation
meso: ACC-STR
phase_micro: pic
prog: prog/saison-2026/macrocycle-02-elevation/meso-01-accumulation-force/S10-2026-10-05.md
statut: en_cours  # feedback lun–mer reçu le 7 oct., jeudi et vendredi le 9 oct. ; sam → dim à venir

jours:
  lundi:
    fait: oui
    charges: "BS 5×3 @ 115 kg repos 2' tenu RPE 7 · hip thrust 3×8 @ 100 kg · hollow hold 3× · adduction iso palier 1 · Zone 2 12–15'"
    note: "Tension adducteur légère, sans douleur — 2e semaine de palier 1 (S08, S10) → critère palier 2 rempli pour S11."
  mardi:
    fait: oui
    charges: "FS pause 3×3 @ 100 kg RPE 7 · strict press 4×4 @ 60 kg RPE 8 · traction lestée 4×4 @ +28–30 kg · bent-over row 3×8 · HSW 2× · suspensions passive + active"
    note: "Press monté à 60 par choix (prescrit 57,5). Gêne d'épaule 1–2/10 sur le press seulement ; tractions, HSW et suspensions indolores. Charges exactes tractions / row non notées."
  mercredi:
    fait: oui
    charges: "WOD team à partager 27:00 — 2000 m row · 100 C2B · 100 FS double DB 22,5 kg · 100 STOH double DB 22,5 kg · 1200 m row ; part ~65 % des reps, ~50 % du row"
    rpe: 7
    note: "Épaule gauche 2/10 sur STOH seulement, supportable. Sous le seuil → jeudi / vendredi inchangés."
  jeudi:
    fait: oui
    charges: "BMU EMOM 10' (4 BMU + 10 cal BikeErg, ~20 s de repos) · HSW 3× (10 m + pivot + 10 m)"
    z2_min: 25  # prescrit 10'
    z2_ergo: BikeErg
    note: "Version complète (team RPE 7). Épaule 0/10 sur BMU, HSW, rotation externe et serratus. Repos > cible ~15 s : BikeErg plus facile que rameur / SkiErg pour 10 cal."
  vendredi:
    fait: oui
    charges: "Deadlift 3×3 @ 160 kg RPE ≤ 7 · top set non tenté · tirage arraché 3×3 @ 105 kg RPE 8 · arraché puissance 3×1 @ 75 kg RPE 8"
    z2_min: 0
    note: "Deadlift en haut de fourchette à RPE ≤ 7 : critère du top set rempli mais non tenté. Barre en haut de fourchette, RPE 8 (cible ≤ 7–7,5) après le deadlift. Épaule 0/10, y compris en réception d'arraché."
  samedi:
    fait: null
  dimanche:
    fait: null

realise:
  force_lower_sets: 11
  force_lower_sets_note: "BS 5 + FS pause 3 + deadlift 3 (sous MRV 12)"
  force_upper_sets: 8
  force_upper_sets_note: "Press 4 + tractions 4"
  oly_lifts: 12
  oly_lifts_note: "Tirage arraché 3×3 + arraché puissance 3×1"
  gym_min: null
  gym_min_note: "Touch mardi (HSW + suspensions) non chronométré ; jeudi : EMOM BMU 10' + HSW 3× (durée HSW non chronométrée)"
  z2_min: null
  z2_min_note: "Finisher lundi 12–15' (durée exacte non notée) + jeudi 25' + vendredi 0 ; samedi à venir"
  threshold_min: null
  hard_min: null
  hard_min_note: "Team mercredi 27' RPE 7 — même convention que S06 / S09 (non compté en minutes dures sous RPE 8)"

team_wod_rpe: 7

team_wod_mouvements:
  - "Rameur ≈ 1000 m + 600 m (50 % de 2000 m + 1200 m)"
  - "C2B ≈ 65"
  - "Front squat double DB 22,5 kg ≈ 65"
  - "STOH double DB 22,5 kg ≈ 65"

decoupage_gym:
  - mouvement: c2b
    annonce: "partage 50/50 avec le binôme"
    tenu: false
    note: "Binôme a lâché, part assumée ~65 %"
    cadence: null

reperes:
  back_squat: "115 kg × 5×3 repos 2' tenu, RPE 7"  # format de référence, rejoué à chaque macro
  front_squat_pause: "100 kg × 3×3, RPE 7"
  deadlift: "160 kg × 3×3, RPE ≤ 7 · top set non tenté"
  strict_press: "60 kg × 4×4, RPE 8"
  traction_lestee: null  # +kg × reps @ RPE (mardi : +28–30, charge exacte non notée)
  arrache_puissance: "75 kg × 3×1, RPE 8 (après deadlift) · tirage 105 kg × 3×3, RPE 8"
  zone2_support_duree: null  # support · minutes (samedi)
  zone2_fc: null  # FC moyenne · FC fin de sortie · allure ou puissance moyenne
  zone2_plafond_fc: null  # FC où la phrase complète devient difficile
  seuil: null  # allure ou split moyen · FC moyenne 3e intervalle · écart intervalle 1 → 5 en %
  fc_max_vue: null

a_verifier:
  - "Zone 2 ≥ 60 min sur la semaine ? (au 9 oct. : ~37–40' lun + jeu → samedi doit couvrir ≥ 20–25')"
  - "Prêt à basculer sur la puissance (S11) ?"

series:  # charge de travail la plus haute par mouvement (cf. journal-schema.yaml v3)
  - { mvt: back_squat, kg: 115, serie: "5×3", rpe: 7, type: travail, note: "repos 2' tenu" }
  - { mvt: front_squat, kg: 100, serie: "3×3", rpe: 7, type: travail, pause: true, note: "avec pause" }
  - { mvt: deadlift, kg: 160, serie: "3×3", rpe: 7, type: travail, note: "top set non tenté" }
  - { mvt: strict_press, kg: 60, serie: "4×4", rpe: 8, type: travail, note: "prescrit 57,5" }
  - { mvt: weighted_pullup, kg: 30, serie: "4×4", rpe: 7.5, type: travail, comble: [rpe], note: "+28–30 kg, charge exacte non notée" }
  - { mvt: power_snatch, kg: 75, serie: "3×1", rpe: 8, type: travail, note: "après le deadlift" }
  - { mvt: snatch_pull, kg: 105, serie: "3×3", rpe: 8, type: travail }

signaux:
  epaule: { niveau: 1, note: "Gêne 1–2/10 sur le press ; 2/10 épaule gauche sur STOH au team" }
  adducteur: { niveau: 1, note: "Tension légère sans douleur (palier 1)" }
  mains: { niveau: 0 }

flags:
  - "Épaule : gêne 1–2/10 sur strict press seulement, sous le seuil d'arrêt ; RMU / HSPU hors plan, tractions / HSW / suspensions indolores"
  - "Adducteur : tension légère sur le palier 1, sans douleur"
  - "Épaule gauche : 2/10 sur STOH (DB 22,5) au team, supportable ; C2B indolores"
  - "Épaule : 0/10 jeudi sur BMU, HSW, rotation externe et serratus"
  - "Épaule : 0/10 vendredi, réception d'arraché à 75 comprise"

ecarts_prescrit_vs_realise:
  - mouvement: strict_press
    prescrit: "4×4 @ 57,5 kg RPE 7–8"
    realise: "4×4 @ 60 kg RPE 8"
    sens: au_dessus
    action: re_ancrer  # 3e semaine au-dessus (S08–S10) : ancre profil = press ×4 @ 60 RPE 8 ; S11–S12 en push press, S14 déjà à 2×4 @ 60 RPE ≤ 7 (cohérent)
  - mouvement: bmu
    prescrit: "EMOM 10' : 4 BMU + 10 cal, repos ~15 s visé"
    realise: "EMOM 10' : 4 BMU + 10 cal BikeErg, ~20 s de repos"
    sens: au_dessus
    action: surveiller  # 1re occurrence ; ergo non précisé dans la prescription — préciser l'ergo ou monter à 12 cal BikeErg si ça se répète
  - mouvement: arrache_puissance
    prescrit: "3×1 @ 70–75 kg RPE ≤ 7 · tirage 3×3 @ 95–105 kg RPE ≤ 7,5"
    realise: "3×1 @ 75 kg RPE 8 · tirage 3×3 @ 105 kg RPE 8"
    sens: au_dessus  # RPE au-dessus de la cible au haut de fourchette ; S09 : 73 / 100 à RPE ≤ 7, sans deadlift lourd avant
    action: surveiller  # placé après un deadlift 3×3 @ 160 ; pas de ré-ancrage tant que ça ne se répète pas en séance fraîche
  - mouvement: deadlift
    prescrit: "3×3 @ 155–160 kg RPE 7–8, top set 172,5–177,5 si RPE ≤ 7"
    realise: "3×3 @ 160 kg RPE ≤ 7, top set non tenté"
    sens: autre
    action: rien  # 1re semaine de deadlift lourd du macro ; marge confirmée à 160

gate: null
synthese: >
  Pic lower bien parti : squat 5×3 @ 115 repos 2' tenu à RPE 7, front squat avec pause 3×3 @ 100 à RPE 7.
  Press monté à 4×4 @ 60 par choix, RPE 8, gêne d'épaule 1–2/10 seulement sur ce geste. Adducteur : tension légère, sans douleur.
  Team 27' RPE 7 (~65 % des reps, C2B au-delà du partage prévu) ; épaule gauche 2/10 sur STOH.
  Jeudi complet : BMU EMOM 10' avec ~20 s de repos (BikeErg), épaule 0/10 sur tous les gestes gym, Zone 2 25' BikeErg (prescrit 10').
  Vendredi : deadlift 3×3 @ 160 à RPE ≤ 7 (top set non tenté), tirage 105 et arraché puissance 75 à RPE 8 après le deadlift ; épaule 0/10. Pas de Zone 2.
suite: >
  Samedi inchangé (sortie longue + bloc seuil, séance de mesure) ; la Zone 2 de la semaine dépend de lui (~37–40' au compteur pour un plancher de 60').
  S11 : palier 2 adducteur confirmé ; push press à surveiller côté épaule (0–2/10).
