gate: null
synthese: >
  Pic lower bien parti : squat 5×3 @ 115 repos 2' tenu à RPE 7, front squat avec pause 3×3 @ 100 à RPE 7.
  Press monté à 4×4 @ 60 par choix, RPE 8, gêne d'épaule 1–2/10 seulement sur ce geste. Adducteur : tension légère, sans douleur.
  Team 27' RPE 7 (~65 % des reps, C2B au-delà du partage prévu) ; épaule gauche 2/10 sur STOH.
  Jeudi complet : BMU EMOM 10' avec ~20 s de repos (BikeErg), épaule 0/10 sur tous les gestes gym, Zone 2 25' BikeErg (prescrit 10').
suite: >
  Vendredi et samedi inchangés (deadlift 3×3 @ 155–160 avec option top set, sortie mesure samedi).
  S11 : palier 2 adducteur confirmé ; push press à surveiller côté épaule (0–2/10).
