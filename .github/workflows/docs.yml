name: Deploy VitePress to GitHub Pages

on:
  push:
    branches: [dev]
    paths:
      - "prog/**"
      - ".vitepress/**"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci || npm install
      - name: Lint prog assets
        run: npm run lint:prog
      - name: Build
        env:
          VITEPRESS_BASE: /${{ github.event.repository.name }}/
        run: npm run docs:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
