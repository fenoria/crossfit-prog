# Schéma du journal athlète — une entrée par semaine
# Entrées : athletes/<id>/journal/SXX-YYYY-MM-DD.yaml (instance)
# Ce fichier : le contrat (méthodo / ops pack)
#
# Pourquoi : le profil doit rester l'ÉTAT COURANT (charges, volumes, crans, planning).
# L'historique semaine par semaine vit ici. Sans cette séparation, le profil grossit,
# l'historique s'arrête en silence (cas S05, non distillée) et les écarts entre
# prescrit et réalisé se détectent des semaines trop tard (cf. arbitrages.md §15).

version: 3
status: validated
updated: 2026-10-09

regles:
  - "Une entrée par semaine, créée dès que la semaine est écrite (statut planifiee, reperes à null, a_verifier), complétée au fil des feedbacks."
  - "Le journal est la SoT du réalisé : le feedback (QCM ou collé) s'écrit ici directement. La semaine prog/ ne reçoit qu'une section « Bilan » lisible (synthèse, repères, suite) en fin de semaine. Dès S10 ; S01–S09 gardent leurs blocs Notes en archive."
  - "Ne jamais inventer un chiffre absent du feedback : mettre null et documenter dans la clé *_note."
  - "Un fait durable (plafond de charge, contrainte planning, cran gym, gêne récurrente) remonte AUSSI au profil."
  - "Le journal est une archive : on n'y réécrit pas le passé, on ajoute."
  - "Champs ajoutés en cours de saison (team_wod_mouvements, familles_couvertes : dès S11 ; decoupage_gym : v2.1) : absents des entrées antérieures, normal — ne pas les rétro-remplir."

champs:
  semaine: "SXX"
  dates: "YYYY-MM-DD → YYYY-MM-DD"
  macro: "dossier macrocycle"
  meso: "code meso (voir methodology.yaml meso_types)"
  phase_micro: "volume | surcharge | pic | deload | test | expression | transition"
  prog: "chemin de la semaine dans prog/"
  statut: "planifiee | en_cours | close"

  jours: >
    Clé par jour (lundi…dimanche). Sous-clés : fait (oui | partiel | non | off),
    charges (texte libre, RPE inline), rpe (séance, /10, surtout team),
    z2_min (minutes de Zone 2 faites ce jour-là, fin de séance comprise ; 0 si pas faite,
    null si non demandée — dès S10 jeudi), z2_ergo, note.

  realise: >
    Doses réellement effectuées sur la semaine — matière première de l'audit.
    Champs : force_lower_sets, force_upper_sets, oly_lifts, gym_min, z2_min, hard_min,
    threshold_min (mêmes noms que la balise dose).
    z2_min = somme des z2_min des jours (fin de séance + séances dédiées) : c'est sur lui
    que l'audit vérifie le plancher Zone 2 (arbitrages §28).
    null autorisé quand le feedback ne permet pas de trancher (+ clé *_note).

  team_wod_rpe: "RPE de la séance team (déclenche la règle J+1 au-delà du seuil profil)"

  team_wod_mouvements: "liste des mouvements + charges du WOD team (dès S11) — null si non noté"

  familles_couvertes: >
    Familles de mouvements réellement faites sur la semaine (ids de movement-coverage.yaml),
    WOD team compris s'il est tracé. Permet de comparer prescrit (mixed= dans la balise dose) et réalisé.

  decoupage_gym: >
    Pour les WODs où un découpage des séries de gym est prescrit (methodology §9.3) :
    mouvement, découpage annoncé, découpage tenu, cadence première vs dernière série
    (stable | en baisse). null si non noté.

  reperes: >
    Relevés attendus de la semaine (charges de référence, repères puissance / gym / aérobie),
    clé = repère, valeur = texte libre. Créés à null à l'écriture de la semaine, format attendu
    en commentaire de fin de ligne ; remplis au feedback, repris dans la section Bilan.

  a_verifier: >
    Liste de questions à trancher au bilan (sensations, critères de passage, gate de macro).
    Écrite avec la semaine ; le QCM les couvre, la réponse va dans jours / flags / synthese.

  flags: "liste courte de faits saillants (douleur, ampoules, séance déplacée, volume hors prog)"

  ecarts_prescrit_vs_realise: >
    Liste. Par item : mouvement, prescrit, realise, sens (au_dessus | en_dessous | autre),
    action (rien | re_ancrer | surveiller). Deux semaines de suite dans le même sens
    sur le même mouvement = la prescription est fausse, pas l'athlète : on ré-ancre.

  gate: "état de la gate de meso si la semaine est en fin de bloc"
  synthese: "2–4 phrases, version coach (la Synthèse du Bilan dans prog/ en est la version lisible)"
  suite: "ce qui a été décidé pour la semaine suivante"

audit:
  retrospectif_partiel: >
    Les semaines antérieures à la mise en place des balises dose (S01–S07) ont un
    bloc realise incomplet : les volumes n'ont pas été recalculés a posteriori.
    L'audit machine ne les traite pas comme des violations.
