# Critères de sortie / gates de meso
# Scope actuel : chemin Macro 1 (benchmarks → ACC-GYM → ACC-STR → TRA-MIX → REAL → Macro2).
# Autres meso_types (ACC-GPP, ACC-OLY, TRA-POW, TRANS) : pas de gate YAML —
# passage via Notes meso + profile jusqu’à Macro 2+.
# Ne pas enchaîner au calendrier seul : vérifier gates + fatigue (+ douleur seulement si signalée).
# Code canonique REAL (label « REAL mini » = même code, durée courte).

version: 1
status: validated
updated: 2026-07-28
scope: macrocycle_1_path
sources:
  - "Israetel — progresser sous MRV, deload"
  - "Issurin — intention de bloc atteinte avant pivot"
  - "Profil — gym volume prioritaire reconstruction"

global_blockers:
  - "douleur lower florissante signalée (≥ 6) → ne pas avancer vers ACC-STR lourd ; adapter"
  - "sommeil / RPE chronique élevé / chute perf → deload avant gate"
  - "prs_current_kg incomplets → ne pas démarrer ACC-GYM chargé (sauf proxies gym seuls OK si force déjà notée)"

gates:
  benchmarks_to_ACC_GYM:
    from: benchmarks
    to: ACC-GYM
    required:
      - "prs_current_kg : au moins BS ou FS, DL, strict_press, weighted_pullup renseignés (ou N/A documenté)"
      - "proxies gym notés (BMU/RMU/HSW/HSPU) dans profile ou Notes S01"
      - "oly power : charges confortables notées (pas forcément 1RM)"
    optional:
      - "ergo court smoke test (benchmarks only — pas un WOD HI)"
    on_fail: "Prolonger benchmarks 2–3 jours ou retester le lift manquant ; ne pas inventer des %"

  ACC_GYM_to_ACC_STR:
    from: ACC-GYM
    to: ACC-STR
    required:
      - "deload ACC-GYM fait (−30 % volume skill) ou semaine pic digérée"
      - "au moins 2 skills gym ont progressé d’un cran ladder OU densité EMOM stable vs baseline"
      - "maintien force respecté (≥ 1 stimulus/semaine) sans casse"
      - "pas de douleur lower florissante signalée bloquant le squat/hinge"
    soft_targets:
      - "BMU : singles EMOM stables (cran ≥ 2) si baseline le permettait"
      - "HSW ou HSPU : volume/distance en hausse vs S01"
    on_fail: "1 semaine ACC-GYM supplémentaire (volume) plutôt que forcer ACC-STR"

  ACC_STR_to_TRA_MIX:
    from: ACC-STR
    to: TRA-MIX
    required:
      - "deload force fait"
      - "charges force actuelles réévaluées (RPE) vs post-benchmarks"
      - "gym maintien ≥ 2 séances/sem. pendant ACC-STR (pas de perte totale skill)"
      - "pas de douleur lower florissante signalée"
    on_fail: "Maintenir ACC-STR léger ou mini ACC-GYM refresh 1 sem."

  TRA_MIX_to_REAL:
    from: TRA-MIX
    to: REAL
    label: "REAL mini (Macro 1)"
    required:
      - "1–2 séances mixed qualité digérées (RPE noté)"
      - "pas de douleur florissante signalée"
      - "fraîcheur relative : pas de semaine surcharge empilée juste avant"
    on_fail: "Semaine volume ↓ / Z2 puis retester mixed"

  REAL_to_transition_or_macro2:
    from: REAL
    to: TRANS_or_Macro2
    required:
      - "mock / test weekend fait ou documenté skip"
      - "notes peaking (ce qui a marché) dans Notes meso (`prog/`)"
      - "calendrier Macro 2 intention définie (même sans A-event)"

retest_policy:
  after_each_macro: "re-benchmark force clé + proxies gym (pas tout re-maxer)"
  mid_meso_if: "doute sur charges ou plateau > 2 semaines"
  never: "retester sur ego pendant deload"
