# Critères de sortie / gates de meso — FICHIER GÉNÉRIQUE
# Les gates décrivent des transitions entre types de meso, pas un calendrier.
# Le chemin réellement suivi, les dates et les numéros de semaine vivent dans
# knowledge/instances/<saison>.yaml. Aucune date ni « SXX » ici.
# Ne pas enchaîner au calendrier seul : vérifier gates + fatigue (+ douleur seulement si signalée).
# Code canonique REAL (label « REAL mini » / pic B = même code, durée courte).

version: 2
status: validated
updated: 2026-09-11
scope: generic
instance: knowledge/instances/saison-2026.yaml  # chemin et calendrier de la saison en cours
sources:
  - "Israetel — progresser sous MRV, deload"
  - "Issurin — intention de bloc atteinte avant pivot"
  - "Bompa — REAL ancré sur les pics de la saison"
  - "Profil athlète actif — priorités et faiblesses (déterminent l'ordre des blocs, voir instance)"

global_blockers:
  - "douleur lower florissante signalée (≥ 6) → ne pas avancer vers ACC-STR lourd ; adapter"
  - "sommeil / RPE chronique élevé / chute perf → deload avant gate"
  - "prs_current_kg incomplets → ne pas démarrer ACC-GYM chargé (sauf proxies gym seuls OK si force déjà notée)"

gates:
  benchmarks_to_ACC_GYM:
    from: benchmarks
    to: ACC-GYM
    required:
      - "prs_current_kg : au moins BS ou FS, DL, strict_press, weighted_pullup renseignés (ou N/A documenté)"
      - "proxies gym notés (BMU/RMU/HSW/HSPU) dans profile ou Notes S01"
      - "oly power : charges confortables notées (pas forcément 1RM)"
    optional:
      - "ergo court smoke test (benchmarks only — pas un WOD HI)"
    on_fail: "Prolonger benchmarks 2–3 jours ou retester le lift manquant ; ne pas inventer des %"

  ACC_GYM_to_REAL:
    from: ACC-GYM
    to: REAL
    label: "entrée en réalisation depuis un bloc gym"
    required:
      - "deload ACC-GYM fait (−30 % volume skill) ou semaine pic digérée / allègement pré-Fire"
      - "au moins 2 skills gym ont progressé d’un cran ladder OU densité EMOM stable vs baseline"
      - "maintien force respecté (≥ 1 stimulus/semaine) sans casse"
      - "fraîcheur relative : pas de semaine surcharge empilée juste avant Fire"
      - "pas de douleur florissante signalée"
    soft_targets:
      - "BMU : singles EMOM stables (cran ≥ 2) si baseline le permettait"
      - "HSW ou HSPU : volume/distance en hausse vs S01"
    on_fail: "1 semaine ACC-GYM supplémentaire (volume) ou allonger le deload ; ne pas forcer un taper A"

  REAL_to_TRANS:
    from: REAL
    to: TRANS
    label: "sortie de compétition"
    required:
      - "weekend de compétition fait ou skip documenté"
      - "débrief par WOD rempli (competition-day.yaml §6) et notes peaking dans `prog/`"
      - "exigences révélées reportées dans competition-demands.yaml"
    on_fail: "Documenter le skip ; enchaîner TRANS quand même si fatigue haute"

  TRANS_to_ACC_STR:
    from: TRANS
    to: ACC-STR
    required:
      - "fatigue subjective redescendue vs semaine de compétition"
      - "intention du macro suivant confirmée"
      - "pas de douleur lower florissante signalée bloquant le squat/hinge"
    on_fail: "Prolonger TRANS 3–7 jours (Z2 / GPP) avant ACC-STR"

  ACC_STR_to_TRA_POW:
    from: ACC-STR
    to: TRA-POW
    required:
      - "semaine de pic force digérée (charges notées, pas de chute de perf)"
      - "charges force actuelles réévaluées (RPE) vs post-benchmarks / post-Fire"
      - "gym maintien ≥ 2 séances/sem. pendant ACC-STR"
      - "pas de douleur lower florissante signalée"
    deload_rule: >
      « Deload force fait » peut être satisfait par la PREMIÈRE SEMAINE du bloc puissance
      quand elle porte la décharge (volume force −40/50 %, RPE ≤ 6,5, pas de hinge lourd)
      — deload Israetel valide + pivot d'intention Issurin. Dans ce cas la gate se vérifie
      à la sortie de cette semaine, pas avant. Une semaine tronquée par des vacances
      en milieu de bloc compte comme décharge intermédiaire.
    on_fail: "Maintenir ACC-STR léger ou mini ACC-GYM refresh 1 sem."

  TRA_POW_to_TRA_MIX:
    from: TRA-POW
    to: TRA-MIX
    required:
      - "power snatch / clean notés à RPE utile, dans les fourchettes réelles de l'athlète"
      - "cycling barre léger tenu sans casse technique"
      - "pas de régression technique majeure"
      - "pas de douleur florissante signalée"
    soft_targets:
      - "kipping HSPU amorcé en ACC-STR (drills → EMOM court → volume) si cran 3 strict stable — sinon rester strict et le noter"
    on_fail: "1 semaine technique / power supplémentaire"

  TRA_MIX_to_specifique:
    from: TRA-MIX
    to: TRA-MIX_team
    required:
      - "2–3 séances mixed qualité digérées (RPE noté) — dont 1 format chronométré et 1 simulation à deux blocs"
      - "repères gym relevés en fin de bloc (densité BMU, série RMU, kipping HSPU, HSW avec pivots)"
      - "pas de douleur florissante signalée"
      - "fraîcheur relative : pas de semaine surcharge empilée juste avant Macro 3 (volume ↓ en fin de dernière semaine)"
    on_fail: "Semaine volume ↓ / Z2 puis retester mixed"

  TRA_MIX_team_to_REAL:
    from: TRA-MIX_team
    to: REAL
    label: "entrée en réalisation depuis un bloc spécifique équipe"
    required:
      - "au moins 2 séances team / formats partagés digérées (ou équivalent box)"
      - "au moins 2 séances avec le ou les partenaires réels de la compétition"
      - "trous de competition-demands.yaml traités ou explicitement assumés"
      - "fraîcheur relative avant le weekend de compétition"
      - "pas de douleur florissante signalée"
    on_fail: "Allonger spécificité légère ou avancer le taper (volume ↓)"

retest_policy:
  after_each_macro: "re-benchmark force clé + proxies gym (pas tout re-maxer)"
  signature_tests: "les trois protocoles figés de knowledge/signature-tests.yaml sont rejoués une fois par macro"
  measured_in_prog: >
    Pas de semaine de tests dédiée quand le calendrier est serré : la semaine de pic
    du bloc force sert de point de mesure (séries lourdes notées), le bloc puissance
    mesure les charges barre, la dernière semaine mixed relève les proxies gym.
    Semaines concrètes : voir points_de_mesure dans l'instance de saison.
  mid_meso_if: "doute sur charges ou plateau > 2 semaines"
  never: "retester sur ego pendant deload"
  after_competition: "débrief par WOD + notes peaking + éventuel recalibrage de charges avant le bloc suivant"
