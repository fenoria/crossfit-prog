# Volumes cibles (Israetel)
# Règle d’écriture (post-S01) :
#   - athlete/profile.yaml → volumes = INSTANCE athlète (chiffres courants, targets semaine)
#   - ce fichier = BORNES / standards méthodo (référence ; Z2 déjà calibré)
# Ne pas remplir les deux « à l’identique » sans sync : en cas de doute, profile gagne pour la prog.

version: 1
status: draft_values  # structure ops OK ; valeurs gym/force/oly après S01 → puis validated
updated: 2026-07-28
note: >
  Sans 1RM / proxies actuels, gym/force/oly restent null.
  Z2 MEV 60 = cible Accumulation / année type.
  En REAL (et souvent TRA), maintenance-doses peut imposer un min Z2 < MEV
  (fraîcheur Issurin) — autorisé, pas une violation Israetel.
  Après benchmarks : estimer MEV bas (entrée ACC-GYM), progresser vers MAV,
  deload si signes MRV (voir profile.coaching.mrv_signals).

domains:
  gym:
    unit: "skill_minutes_quality_per_week"  # EMOM/drills submax, hors warm-up
    mev: null
    mav: null
    mrv: null
    starting_note: "Post-S01 : partir bas (ex. 40–60 min skill qualité/sem.) puis +10–15 %/sem. si récup OK"

  force_lower:
    unit: "hard_sets_per_week"  # séries ≥ RPE 6–7 squat/hinge
    mev: null
    mav: null
    mrv: null

  force_upper:
    unit: "hard_sets_per_week"
    mev: null
    mav: null
    mrv: null

  oly:
    unit: "quality_lifts_per_week"  # singles/doubles techniques comptés
    mev: null
    mav: null
    mrv: null

  z2:
    unit: "minutes_per_week"
    mev: 60
    mav: 120
    mrv: 180
    note: >
      MEV Accumulation / année. REAL peut descendre à 30 min/sem. (maintenance-doses)
      sans être « sous-MEV illégal » — peaking = fraîcheur.

deload_default:
  volume_reduction_pct: 30
  intensity: "maintenir charges relatives ou −5 %, couper volume"
