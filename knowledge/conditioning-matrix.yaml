# Matrice conditioning (sans Jamieson) — fallback Bible PP + Issurin + Bompa
# Gap corpus : Ultimate MMA Conditioning indisponible — ne pas inventer une granularité Jamieson.

version: 1
status: validated
updated: 2026-07-28
sources:
  - "Reiss & Prévost — La bible de la préparation physique"
  - "Issurin — Block Periodization (aérobie tôt, spécificité tard)"
  - "Bompa — peaking / taper"
  - "Profil : cardio fort → maintien, ne pas sur-stimuler"

athlete_rule: >
  Conditioning = maintien. Z2 fréquent (préférence). HI surtout en TRA/REAL.
  Ergos / WB / burpees déjà forts → ROI faible à pousser le HI en Accumulation.

systems:
  z2:
    name: "Aérobie Z2"
    intent: "Récup active, base, préférence athlète (Z2 > off)"
    markers: "parole possible, RPE 3–5"
    when: "toute l’année, surtout Accumulation / TRANS"
    dose_cap:
      weekday_finisher_min: "8–15"
      dedicated_session_min: "30–60+"
      week_min_typical: 60
    notes: "Créneau dispo sans fatigue haute → Z2 plutôt qu’off"

  tempo_threshold:
    name: "Tempo / seuil"
    intent: "Capacité continuum aéro-anaérobie sans glycolyse max"
    markers: "RPE 6–7, durées contrôlées"
    when: "fin Accumulation / début Transmutation, rare"
    dose_cap:
      sessions_per_week_max: 1
      work_min: "12–25"
    notes: "Pas en semaine deload / benchmarks lourds"

  glycolytic:
    name: "Glycolytique / mixed dur"
    intent: "Spécificité CF sous acidose (couplets, chippers durs)"
    markers: "RPE 8–9, récup incomplète"
    when: "TRA-MIX, TRA-POW, REAL uniquement"
    dose_cap:
      sessions_per_week_max: 2
      hard_minutes_week_max: 30
    notes: "Team WOD dur compte dans le quota"

  alactic_power:
    name: "Alactique / puissance courte"
    intent: "Puissance / densités très courtes (sprints ergo, complexes courts)"
    markers: "effort ≤ 15–20 s, repos long"
    when: "TRA-POW, REAL ; optionnel ACC-STR neural"
    dose_cap:
      sessions_per_week_max: 1
      total_work_sec_week: "60–120"
    notes: "Ne remplace pas le volume gym prioritaire"

forbidden_outside_specific: >
  Pas de WODs « hero » / chippers durs gratuits en ACC-GYM / ACC-STR.
  Exception benchmarks : smoke test ergo court optionnel (ex. 500 m)
  pour calibrer — 1 effort max, skip si adducteur/fatigue ; ce n’est pas du HI de développement.

team_box:
  count_as: "glycolytic si RPE ≥ 7 ; Z2/tempo si easy"
  adjust_next_day: true
