status: validated
version: 1
updated: 2026-07-29
validated_on: 2026-07-27
# md = narratif athlète ; yaml = contrat machine — garder meso_types / order / status sync
source_of_truth:
  knowledge: "knowledge/ (méthodo + ops) — books/ = brut"
  athlete: "athlete/profile.yaml — instance (charges, volumes, douleur)"
  prog: "prog/ — séances exécutées"
  history: "history/decisions.md — arbitrages coach"
pilots:
  structure: issurin
  dosing: israetel
  gym: low
  oly: everett
  transfer: verkhoshansky
  macro_peaking: bompa
  mental: encyclo_pm
  conditioning: laursen_buchheit_hiit
secondary_refs: [encyclo_pp, manuel_muscu, bible_pp]
gaps: []

ops_pack:
  validated_on: 2026-07-28
  files:
    - knowledge/maintenance-doses.yaml
    - knowledge/meso-gates.yaml
    - knowledge/gym-ladder.md
    - knowledge/session-patterns.yaml
    - knowledge/warmups.yaml
    - knowledge/adductor-protocol.yaml
    - knowledge/conditioning-matrix.yaml
    - knowledge/volume-landmarks.yaml
  templates:
    - prog/_templates/semaine.md
    - prog/_templates/meso.md
  lint: "npm run lint:prog"

principles:
  - one_dominant_intent_per_meso
  - mev_mav_mrv_deloads
  - residual_effects_sequencing
  - transfer_to_cf_specificity
  - pedagogy_at_every_level
  - z2_over_off_when_possible
  - cut_volume_not_intent_when_fatigued
  - health_over_ego_bar_confidence_current_loads
  - z2_may_be_below_mev_in_REAL_for_freshness

# Codes canoniques = meso_types. Label « REAL mini » = code REAL (durée courte Macro 1).
meso_code_aliases:
  REAL-mini: REAL
  "REAL mini": REAL

default_meso_order_post_injury:
  - benchmarks
  - ACC-GYM
  - ACC-STR
  - TRA-MIX
  - REAL  # label humain : REAL mini (Macro 1)

annual_structure:
  model: bompa_multi_peak_plus_issurin_stages
  macrocycles_per_year: "2-3"
  stage_pattern: [accumulation, transmutation, realization]
  transition_weeks_end: "2-4"
  note: "BON linear FORCE-GYM-OLY-SPEC rejected as annual template; annual model validated 2026-07-27"
  annual_validated_on: 2026-07-27
  rejected_annual_template: ["FORCE", "GYM", "HALTERO", "SPECIFIQUE", "PRECOMP", "TAPER_ONCE"]

meso_types:
  - ACC-GPP
  - ACC-GYM
  - ACC-STR
  - ACC-OLY
  - TRA-MIX
  - TRA-POW
  - REAL
  - TRANS

microcycle_template:
  - volume_adaptatif
  - surcharge_controlee
  - pic
  - deload

session_budget_min:
  weekday: 90
  saturday_every_other: 150

domains:
  force:
    patterns: [squat, hinge, press, pull]
    intensity_note: "based_on_current_benchmarks"
    accumulation_pct_felt: "70-85"
    warmup_required_lower: warmup_adductor_friendly
  gym:
    priority: high
    focuses: [rmu, bmu, hsw, hspu, density]
  oly:
    prefer: [power_snatch, power_clean, hangs, pulls]
    limit: [heavy_squat_snatch, heavy_squat_clean]
  conditioning:
    role: maintenance
    z2: frequent
    high_intensity: "TRA-MIX / TRA-POW / REAL only — see conditioning-matrix.yaml"
