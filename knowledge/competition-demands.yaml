# Analyse des exigences de compétition → liste de trous → programmation
# Sources : Verkhoshansky (transfert : préparer le régime réel) · Issurin (spécificité tardive)
#           Bompa (peaking sur les exigences identifiées) · débriefs de compétition

version: 1
status: validated
updated: 2026-10-03

pourquoi: >
  La programmation se construisait à partir des qualités générales (force, gym, filières)
  et des faiblesses ressenties. Aucun document ne partait de ce que la compétition demande
  réellement. Résultat : des trous invisibles jusqu'au jour J — un mouvement jamais
  travaillé au standard, un objet lourd jamais manipulé, un format jamais répété.

methode:
  1: "Recenser les exigences observées : débriefs par WOD (competition-day.yaml §6), book de l'épreuve, éditions précédentes, formats habituels de l'organisateur."
  2: "Pour chaque exigence : statut athlète — couvert / partiel / trou — avec la preuve (semaine, chiffre, feedback)."
  3: "Les trous deviennent des lignes de programmation du bloc spécifique. Pas de trou sans action, pas d'action sans trou."
  4: "Relire cette liste à l'entrée de chaque bloc de réalisation ; l'actualiser après chaque compétition."

# ─────────────────────────────────────────────────────────────
# Exigences connues
# ─────────────────────────────────────────────────────────────

exigences:
  format_multi_wod:
    exigence: "6 à 10 épreuves sur deux jours, heats espacés, longues attentes"
    statut: partiel
    preuve: "Trame de journée dans competition-day.yaml ; vécu sur Battle et Fire 2026. Pas de répétition hors compétition prévue (décision 2026-10-03)."

  team_synchronisation:
    exigence: "Répartition des reps, bascules, mouvements synchronisés, un appelant"
    statut: partiel
    preuve: >
      Fire 2026 : WOD 2 répartition claire sans switch (ski 165 cal = 1er, couplet partenaire 350 = 6e).
      WOD 4 Isabel synchro 48/60, 7e — partenaire imposait les pauses. Team mercredi box ≠ partenaire compétition.
    action: "Bloc spécifique team : au moins deux séances avec la partenaire réelle, plan de bascule écrit, synchro barre à charge moyenne"

  objets_lourds_inhabituels:
    exigence: "Worm, sac, sled, D-ball, objets non standard fréquents en compétition team"
    statut: partiel
    preuve: >
      Fire 2026 : sled pull 200+200 m (WOD 1) 5e, pas limitant.
      Brancard + buse (WOD 5) 6e, limiteur = course avec charge.
      Worm (WOD 7) chaos (timing / hang / épaule synchro), 9e — toujours le trou.
    action: "Bloc spécifique : worm / port lourd si la box l'a ; sinon ne pas découvrir le jour J. Sled n'est plus un trou."

  squat_clean_squat_snatch_au_standard:
    exigence: "Les standards de compétition imposent parfois le squat clean ou le squat snatch"
    statut: trou_assume
    preuve: >
      Interdits à l'entraînement depuis la désinsertion adducteur — seul le power est travaillé.
      Fire 2026 WOD 6 : power autorisé, 95 kg (3 TNG + 3 FS + STOH) RPE 7, 3e, RAS adducteur.
      WOD 4 snatch @ 50 kg : limiteur = synchro, pas l'amplitude.
    action: >
      Trou volontaire : garder l'interdiction, compenser power + front squat. Fire n'a pas
      sanctionné le trou (power accepté). À réexaminer si la réathlétisation ouvre l'amplitude
      chargée (reathletisation.md, paliers 4–5). Signal positif : FS après cleans @ 95 kg en RAS.

  pompes_appui_renverse_en_volume:
    exigence: "HSPU en volume, souvent kipping, sous fatigue"
    statut: partiel
    preuve: "Strict solide (5×10 en S04), kipping introduit seulement à partir de S08 et jamais ouvert pendant la semaine de Fire (S06)"
    action: "Rampe kipping S08 → S15 avec relevé en S15 ; sous fatigue dans les couplets du bloc mixed"

  repetabilite_gym_sous_fatigue:
    exigence: "Refaire des séries de muscle-ups quand le cardio est haut"
    statut: partiel
    preuve: "Faiblesse déclarée n°1 ; couplets EMOM tenus au calme (S04). Fire 2026 n'a pas sollicité BMU/RMU — le trou gym réel était le butterfly (voir kipping_pull_cycling)."
    action: "Test signature T1 à chaque macro ; couplets après pré-fatigue maintenus dans le bloc spécifique"

  kipping_pull_cycling:
    exigence: "Pull-ups butterfly et chest-to-bar en volume / sous fatigue, y compris dans un complexe gym court"
    statut: trou_assume
    preuve: "Fire 2026 WOD 3 : cut en ½, 7e, RPE 10 — butterfly = gros trou. C2B non vu, même famille de kipping cycling."
    action: "Pas dans Macro 2. Macro 3 (accumulation gym) : kip swings → butterfly → C2B, volume bas à modéré, sous condition épaule. Volume en format en janvier 2027 (Open)."

  grip_et_mains:
    exigence: "Enchaîner barre, anneaux, cordes et rameur sans lâcher sur les mains"
    statut: partiel
    preuve: "Ampoules limitantes en S01 et S02 ; plus de signalement depuis"
    action: "Gestion des mains dans la trame de journée (competition-day.yaml) ; ne pas empiler suspendu la veille d'un gros volume BMU"

  formats_longs_multi_blocs:
    exigence: "Chippers de 12 à 20 min à plusieurs blocs, gestion de pacing"
    statut: couvert
    preuve: "AMRAP 12' en S13, chipper plafond 16' en S15, consignes de pacing explicites"

  charges_barre_en_wod:
    exigence: "Cycling de barre à charge moyenne sous fatigue (60–80 kg à l'épaulé)"
    statut: couvert
    preuve: "Densité barre en S12, épaulés à 60–70 kg dans les formats S13 à S15"

  variete_mouvements:
    exigence: "Corde (DU), sauts (box jump over), haltères (DB snatch), objets, course chargée — mouvements fréquents en WOD de compétition"
    statut: partiel
    preuve: >
      Audit du 2 oct. 2026 : DU écrits une seule fois sur S01–S15, box jumps / sandbag / thrusters jamais.
      Couverture laissée au WOD team du mercredi, non tracé. Aucun signalement de trou en compétition
      sur ces gestes, mais aucune donnée non plus.
    action: "Bloc variété hebdomadaire dès S11 (movement-coverage.yaml, audité par le lint) · référence DU en S15 · mouvements du WOD team notés"

  gestion_mentale_journee:
    exigence: "Routine avant heat, focus, refermer un WOD raté"
    statut: partiel
    preuve: "Aucun protocole écrit avant competition-day.yaml (§5)"
    action: "Appliquer la routine à chaque format chronométré (S13–S15) et à chaque workout de l'Open 2027"

# ─────────────────────────────────────────────────────────────
# Échéance suivante — CrossFit Open 2027 (individuel, 3 workouts)
# ─────────────────────────────────────────────────────────────

open_2027:
  format: "Individuel · un workout par semaine (annonce le jeudi, fait à la box le vendredi) · mouvements standard, formats de ~8 à 20 min"
  exigences_cles:
    - "Gym en volume à cadence régulière : T2B, butterfly / C2B, muscle-ups, pompes en appui renversé, marche sur les mains"
    - "Corde (DU) et WB en séries longues, souvent juste après un autre mouvement"
    - "Barre à charge moyenne en cycling, parfois en échelle de charge"
    - "Haltère (DB snatch), burpees, ergos"
  trous_prioritaires: [kipping_pull_cycling, pompes_appui_renverse_en_volume, repetabilite_gym_sous_fatigue]
  hors_sujet: "Objets lourds, course chargée, synchro partenaire — trous de compétition team, gardés pour Battle 2027"
  route: "Macro 3 accumulation gym (nov.–déc. 2026) → conversion Open (janv.–mi-févr. 2027) → Open"

# ─────────────────────────────────────────────────────────────
# À compléter après chaque compétition
# ─────────────────────────────────────────────────────────────

a_completer:
  fire_2026:
    quand: "après le weekend des 12–13 septembre 2026"
    source: "grille de débrief par WOD dans les Notes de S06 (QCM 2026-09-14)"
    statut: rempli
    resultat: "7e / 20 RX team mixte à 2 ; cut avant la finale"
    facteurs_limitants: "skill_gym dominant (butterfly WOD 3) ; worm (WOD 7) ; synchro barre (WOD 4) ; course avec charge (WOD 5)"
    mouvements_non_prepares: "butterfly PU · C2B (même famille, 2027) · worm timing"
    ce_qui_a_porte: "cardio/ergos (ski 1er) · barre power (WOD 6 3e, RPE 7) · team répartition (WOD 2) · taper S06 (fraîcheur 5/5)"
    gestion_journee: "fraîcheur entrée 5/5 J1, 4/5 J2 ; douleur RAS ; sommeil / ravitaillement / re-warm non collectés"
